data_ingestion:
  test_size : 0.20
  required_columns:
    - age
    - gender
    - bmi
    - bloodpressure
    - diabetic
    - children
    - smoker

data_preprocessing:
  features:
    - age
    - gender
    - bmi
    - bloodpressure
    - diabetic
    - children
    - smoker
  target: claim
  outliers : 
    - bmi
    - bloodpressure
  num_cols : 
    - age
    - bmi
    - bloodpressure

model_building:
  parameters:
    learning_rate: 0.05
    max_depth: 3
    n_estimators: 100
    subsample: 1.0

