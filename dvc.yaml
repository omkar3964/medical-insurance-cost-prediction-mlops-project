

stages:
  data_ingestion:
    cmd: python src/data/data_ingestion.py
    deps:
      - src/data/data_ingestion.py
      - notebooks/insurance.csv
    params:
      - data_ingestion.test_size
      - data_ingestion.required_columns
    outs:
      - data/raw/train.csv
      - data/raw/test.csv

  data_preprocessing:
    cmd: python src/data/data_preprocessing.py
    deps:
      - src/data/data_preprocessing.py
      - data/raw/train.csv
      - data/raw/test.csv
    params:
      - data_preprocessing.features
      - data_preprocessing.target
      - data_preprocessing.outliers
      - data_preprocessing.num_cols
    outs:
      - data/processed/train.csv
      - data/processed/test.csv
      - models/scaler.pkl

  model_building:
    cmd: python src/model/model_building.py
    deps:
      - src/model/model_building.py
      - data/processed/train.csv
      - models/scaler.pkl
    params:
      - model_building.parameters.learning_rate
      - model_building.parameters.max_depth
      - model_building.parameters.n_estimators
      - model_building.parameters.subsample
    outs:
      - models/model.pkl

  model_evaluation:
    cmd: python src/model/model_evaluation.py
    deps:
      - src/model/model_evaluation.py
      - models/model.pkl
      - data/processed/test.csv
    outs:
      - reports/metrics.json
      - reports/experiment_info.json

  model_registration:
    cmd: python src/model/register_model.py
    deps:
      - src/model/register_model.py
      - reports/metrics.json
      - reports/experiment_info.json
      - models/model.pkl
    params:
      - register_model.MODEL_NAME
      - register_model.ACCEPTANCE_CRITERIA.min_r2
      - register_model.ACCEPTANCE_CRITERIA.max_rmse
